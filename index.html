<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#121016">
<title>Wer ist der Imposter?</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%95%B5%EF%B8%8F%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
  :root{
    --bg: #121016;
    --bg-2: #1A1620;
    --surface: #1E1B26;
    --surface-2: #262230;
    --border: rgba(255,255,255,0.08);
    --text: #F4F2F8;
    --text-dim: #9C96AA;
    --accent: #7C5CFC;
    --accent-2: #9B7CFF;
    --accent-contrast: #0E0C14;
    --danger: #FF5A6E;
    --ok: #3DDC97;
  }
  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body{ height: 100%; }
  body{
    margin: 0;
    font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    background-image:
      radial-gradient(circle at 15% -10%, rgba(124,92,252,0.20), transparent 55%),
      radial-gradient(circle at 90% 110%, rgba(124,92,252,0.12), transparent 50%);
    background-attachment: fixed;
    color: var(--text);
    min-height: 100dvh;
    -webkit-font-smoothing: antialiased;
  }
  #app{
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    padding: max(24px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom));
  }
  .screen{
    flex: 1;
    display: flex;
    flex-direction: column;
    width: 100%;
    max-width: 480px;
    margin: 0 auto;
    animation: fadeIn .35s ease both;
  }
  @keyframes fadeIn{ from{ opacity:0; transform: translateY(6px); } to{ opacity:1; transform: translateY(0); } }
  @keyframes scaleIn{ from{ opacity:0; transform: scale(.9); } to{ opacity:1; transform: scale(1); } }

  h1,h2,h3,p{ margin: 0; }
  .brand{
    text-align: center;
    font-size: 1.15rem;
    font-weight: 700;
    letter-spacing: 0.02em;
    color: var(--text-dim);
    margin-bottom: 8px;
  }
  .brand strong{ color: var(--text); }

  .spacer{ flex: 1; }
  .center-col{
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 28px;
  }

  label{
    display: block;
    font-size: 0.85rem;
    color: var(--text-dim);
    margin-bottom: 8px;
    font-weight: 500;
  }
  input[type="text"]{
    width: 100%;
    font-family: inherit;
    font-size: 1.1rem;
    font-weight: 600;
    color: var(--text);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 16px 18px;
    outline: none;
    transition: border-color .15s ease, background .15s ease;
  }
  input[type="text"]:focus{ border-color: var(--accent); background: var(--surface-2); }
  input[type="text"]::placeholder{ color: var(--text-dim); font-weight: 500; }
  .code-input{
    text-align: center;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    font-size: 1.6rem;
  }

  button{
    font-family: inherit;
    border: none;
    cursor: pointer;
    -webkit-appearance: none;
    appearance: none;
  }
  .btn{
    display: block;
    width: 100%;
    padding: 18px 20px;
    border-radius: 16px;
    font-size: 1.05rem;
    font-weight: 700;
    text-align: center;
    transition: transform .12s ease, opacity .12s ease, filter .12s ease;
  }
  .btn:active{ transform: scale(0.97); }
  .btn:disabled{ opacity: 0.4; cursor: not-allowed; transform: none; }
  .btn-primary{
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #fff;
    box-shadow: 0 10px 30px -10px rgba(124,92,252,0.55);
  }
  .btn-primary:active:not(:disabled){ filter: brightness(0.95); }
  .btn-secondary{
    background: var(--surface);
    color: var(--text);
    border: 1px solid var(--border);
  }
  .btn-ghost{
    background: transparent;
    color: var(--text-dim);
    font-weight: 600;
    padding: 12px;
    font-size: 0.95rem;
  }
  .btn-danger{
    background: rgba(255,90,110,0.12);
    color: var(--danger);
    border: 1px solid rgba(255,90,110,0.3);
  }
  .btn-row{ display: flex; flex-direction: column; gap: 12px; }

  .error-text{
    color: var(--danger);
    font-size: 0.9rem;
    font-weight: 600;
    text-align: center;
    min-height: 1.2em;
  }

  .card{
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 22px;
  }

  /* Waiting room */
  .code-display{
    text-align: center;
    padding: 28px 20px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 24px;
  }
  .code-display .label{ font-size: 0.8rem; color: var(--text-dim); font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 10px; }
  .code-display .code{
    font-size: clamp(2.4rem, 14vw, 3.4rem);
    font-weight: 700;
    letter-spacing: 0.18em;
    color: var(--text);
  }
  .copy-btn{
    margin-top: 14px;
    display: inline-block;
    width: auto;
    padding: 10px 18px;
    border-radius: 999px;
    font-size: 0.85rem;
  }

  .player-list{
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .player-list li{
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px 16px;
    font-weight: 600;
  }
  .tag{
    font-size: 0.7rem;
    font-weight: 700;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--accent-2);
    background: rgba(124,92,252,0.14);
    padding: 4px 8px;
    border-radius: 999px;
  }
  .li-actions{
    display: flex;
    align-items: center;
    gap: 6px;
    flex-shrink: 0;
  }
  .icon-btn{
    background: transparent;
    border: none;
    color: var(--text-dim);
    font-size: 1rem;
    line-height: 1;
    padding: 4px 6px;
    border-radius: 8px;
    cursor: pointer;
  }
  .icon-btn:active{ transform: scale(0.92); background: var(--surface-2); }
  .icon-btn.confirm{ color: var(--ok); }
  .icon-btn.cancel{ color: var(--danger); }
  .player-list li.editing{ gap: 10px; }
  .edit-name-input{
    flex: 1;
    min-width: 0;
    font-family: inherit;
    font-size: 0.95rem;
    font-weight: 600;
    color: var(--text);
    background: var(--surface-2);
    border: 1px solid var(--accent);
    border-radius: 10px;
    padding: 9px 12px;
    outline: none;
  }
  .online-dot{
    display: inline-block;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    margin-right: 8px;
    background: var(--text-dim);
    opacity: 0.35;
    flex-shrink: 0;
    vertical-align: middle;
  }
  .online-dot.online{
    background: var(--ok);
    opacity: 1;
  }
  .section-title{
    font-size: 0.8rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin: 22px 0 10px;
  }
  .hint-text{
    text-align: center;
    color: var(--text-dim);
    font-size: 0.9rem;
    margin-top: 12px;
  }

  /* Word screen */
  .word-stage{
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    gap: 14px;
  }
  .word-eyebrow{
    font-size: 0.85rem;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-dim);
  }
  .word-eyebrow.imposter{ color: var(--danger); }
  .the-word{
    font-size: clamp(2.6rem, 13vw, 4.6rem);
    font-weight: 700;
    line-height: 1.05;
    word-break: break-word;
  }
  .imposter-note{
    max-width: 320px;
    color: var(--text-dim);
    font-size: 0.95rem;
    line-height: 1.5;
    margin-top: 6px;
  }

  /* Discussion */
  .timer{
    text-align: center;
    font-size: 0.95rem;
    font-weight: 700;
    color: var(--text-dim);
    letter-spacing: 0.08em;
    margin-bottom: 4px;
  }
  .vote-btn{
    width: 100%;
    text-align: left;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px 16px;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 8px;
  }
  .vote-btn.voted{
    border-color: var(--accent);
    background: rgba(124,92,252,0.12);
  }
  .vote-check{ color: var(--accent-2); font-weight: 700; opacity: 0; }
  .vote-btn.voted .vote-check{ opacity: 1; }

  /* Reveal */
  .reveal-stage{
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    gap: 8px;
  }
  .reveal-eyebrow{
    font-size: 0.85rem;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--danger);
    animation: scaleIn .4s ease both;
  }
  .reveal-name{
    font-size: clamp(2.2rem, 11vw, 3.6rem);
    font-weight: 700;
    animation: scaleIn .45s ease both;
    animation-delay: .05s;
  }
  .reveal-words{
    margin-top: 18px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    width: 100%;
    animation: fadeIn .5s ease both;
    animation-delay: .15s;
  }
  .reveal-word-row{
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px 16px;
  }
  .reveal-word-row .k{ color: var(--text-dim); font-size: 0.85rem; font-weight: 600; }
  .reveal-word-row .v{ font-weight: 700; font-size: 1.05rem; }

  .tally-row{
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 4px;
    font-size: 0.95rem;
    font-weight: 600;
    color: var(--text-dim);
    border-bottom: 1px solid var(--border);
  }
  .tally-row:last-child{ border-bottom: none; }
  .tally-row.is-imposter{ color: var(--text); }
  .tally-summary{
    text-align: center;
    font-size: 0.9rem;
    color: var(--text-dim);
    margin-bottom: 6px;
  }

  .verdict-banner{
    text-align: center;
    font-size: 1rem;
    font-weight: 700;
    line-height: 1.4;
    padding: 14px 16px;
    border-radius: 14px;
    margin: 4px 0 20px;
  }
  .verdict-ok{ background: rgba(61,220,151,0.14); color: var(--ok); }
  .verdict-bad{ background: rgba(255,90,110,0.14); color: var(--danger); }
  .verdict-neutral{ background: rgba(156,150,170,0.14); color: var(--text-dim); }

  .spicy-toggle{
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px 16px;
    font-weight: 600;
    font-size: 0.92rem;
    color: var(--text);
    cursor: pointer;
    margin: 14px 0 4px;
  }
  .spicy-toggle input[type="checkbox"]{
    width: 20px;
    height: 20px;
    flex-shrink: 0;
    accent-color: var(--accent);
    cursor: pointer;
  }
  .spicy-hint{
    text-align: center;
    font-size: 0.78rem;
    color: var(--text-dim);
    margin: 6px 0 4px;
  }

  .loading-stage{
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-dim);
    font-weight: 600;
    letter-spacing: 0.05em;
  }

  .conn-status{
    text-align: center;
    font-size: 0.72rem;
    font-weight: 600;
    color: var(--text-dim);
    margin: -4px 0 10px;
    letter-spacing: 0.02em;
  }
  .conn-status.offline{ color: var(--danger); }
  .error-detail{
    color: var(--text-dim);
    font-size: 0.72rem;
    font-weight: 500;
    text-align: center;
    opacity: 0.75;
    word-break: break-word;
    max-width: 320px;
    margin: 0 auto;
  }

  #toast{
    position: fixed;
    left: 50%;
    bottom: max(24px, env(safe-area-inset-bottom));
    transform: translate(-50%, 20px);
    background: var(--surface-2);
    border: 1px solid var(--border);
    color: var(--text);
    font-weight: 600;
    font-size: 0.9rem;
    padding: 12px 20px;
    border-radius: 999px;
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s ease, transform .2s ease;
    z-index: 50;
    max-width: 90vw;
    text-align: center;
  }
  #toast.show{
    opacity: 1;
    transform: translate(-50%, 0);
  }

  @supports not (backdrop-filter: blur(1px)){
    .card, .surface{ background: var(--surface); }
  }
</style>
</head>

function esc(str){
  return String(str).replace(/[&<>"']/g, (c) => ({
    "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;"
  }[c]));
}

function isPlayerOnline(player){
  if (!player || !player.lastSeen) return false;
  return (Date.now() - player.lastSeen) < ONLINE_THRESHOLD_MS;
}

// Small dot + escaped name, used everywhere a player name shows up in a list
// so the online/offline state reads consistently across screens.
function playerNameHtml(uid, players){
  const p = (players && players[uid]) || {};
  const online = isPlayerOnline(p);
  return `<span class="online-dot ${online ? "online" : ""}" data-uid="${esc(uid)}"></span>${esc(p.name || "?")}`;
}

function generateCode(){
  let out = "";
  for (let i = 0; i < 4; i++){
    out += CODE_CHARS[Math.floor(Math.random() * CODE_CHARS.length)];
  }
  return out;
}

let toastTimer = null;
function showToast(msg){
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), 3200);
}

const app = {
  uid: null,
  name: "",
  code: null,
  isHost: false,
  lobbyData: null,
  secretData: null,
  localPhase: "word", // 'word' | 'discussion'
  lastSeenRound: -1,
  unsubLobby: null,
  unsubSecret: null,
  screen: "loading", // 'loading' | 'auth-error' | 'start' | 'in-lobby'
  startMode: "menu", // 'menu' | 'join'
  currentRoundSecret: null,
  online: (typeof navigator !== "undefined" ? navigator.onLine : true),
  connLostLobby: false,
  connLostSecret: false,
  authErrorDetail: "",
  editingOwnName: false,
  editingOwnNameDraft: null
};

// Client-side timeout wrapper: Firestore calls have no built-in short timeout,
// so a bad connection can leave a request hanging indefinitely with the UI
// stuck on "Trete bei …" etc. This forces a clear failure after FIRESTORE_TIMEOUT_MS.
const FIRESTORE_TIMEOUT_MS = 12000;
function withTimeout(promise, label){
  return Promise.race([
    promise,
    new Promise((_, reject) => setTimeout(() => {
      const err = new Error(`Verbindung dauert ungewöhnlich lange (${label})`);
      err.code = "client-timeout";
      reject(err);
    }, FIRESTORE_TIMEOUT_MS))
  ]);
}

function errDetail(e){
  const detail = (e && (e.code || e.message)) || "";
  return detail ? ` (${detail})` : "";
}

let discussionTimerHandle = null;
let discussionTimerStart = null;
function stopDiscussionTimer(){
  if (discussionTimerHandle){
    clearInterval(discussionTimerHandle);
    discussionTimerHandle = null;
    discussionTimerStart = null;
  }
}
function ensureDiscussionTimer(){
  if (discussionTimerHandle) return;
  discussionTimerStart = Date.now();
  discussionTimerHandle = setInterval(() => {
    const el = document.getElementById("timer-display");
    if (!el) return;
    const elapsed = Math.floor((Date.now() - discussionTimerStart) / 1000);
    const m = String(Math.floor(elapsed / 60)).padStart(2, "0");
    const s = String(elapsed % 60).padStart(2, "0");
    el.textContent = `${m}:${s}`;
  }, 1000);
}

// Heartbeat: while a player is in a lobby, periodically stamp their own
// players.{uid}.lastSeen so everyone else can tell they're still actually
// here (vs. just still listed in the players map from whenever they joined).
// startHeartbeat() always clears any previous handle first, so calling
// enterLobby() more than once can never stack up parallel intervals.
let heartbeatHandle = null;
function startHeartbeat(){
  stopHeartbeat();
  heartbeatHandle = setInterval(() => {
    if (!app.code || !app.uid) return;
    updateDoc(lobbyRef(app.code), { [`players.${app.uid}.lastSeen`]: Date.now() })
      .catch((e) => console.error("Heartbeat fehlgeschlagen:", e));
  }, HEARTBEAT_INTERVAL_MS);
}
function stopHeartbeat(){
  if (heartbeatHandle){ clearInterval(heartbeatHandle); heartbeatHandle = null; }
}

// Online/offline is computed from lastSeen vs. Date.now() at render time, so
// it needs to be re-evaluated even when no new Firestore snapshot comes in
// (otherwise a dot would just freeze "online" forever once the last event
// arrived). This used to call the full render() every 5s, which replaces the
// entire screen's innerHTML — replaying every CSS fade/scale-in animation
// and, worse, wiping out anything the user was mid-typing in a text input
// (like the imposter's word guess on the "guessing" screen). Ticking
// updateOnlineDots() instead just flips the .online class on the existing
// dot elements in place, with no DOM rebuild.
let presenceTickHandle = null;
function startPresenceTick(){
  stopPresenceTick();
  presenceTickHandle = setInterval(updateOnlineDots, 5000);
}
function stopPresenceTick(){
  if (presenceTickHandle){ clearInterval(presenceTickHandle); presenceTickHandle = null; }
}

// Lightweight presence refresh: toggles online/offline dots directly on the
// existing DOM nodes (matched via data-uid, see playerNameHtml) instead of
// going through render(). Used by the presence tick above and by the
// heartbeat-only snapshot short-circuit in subscribeLobby() below.
function updateOnlineDots(){
  if (app.screen !== "in-lobby" || !app.lobbyData) return;
  const players = app.lobbyData.players || {};
  document.querySelectorAll(".online-dot[data-uid]").forEach((dot) => {
    const uid = dot.getAttribute("data-uid");
    dot.classList.toggle("online", isPlayerOnline(players[uid]));
  });
}

// Order-independent deep equality for plain JSON-ish data (objects, arrays,
// primitives) — used below to tell a "nothing but a heartbeat changed"
// snapshot apart from one with an actual game-state change. Deliberately not
// using JSON.stringify for this: Firestore doesn't guarantee stable key
// ordering between snapshots of the "same" data, and a false negative here
// (treating a real change as heartbeat-only) would silently skip a needed
// re-render, which is worse than the flicker this is fixing.
function deepEqualIgnoring(a, b){
  if (a === b) return true;
  if (typeof a !== typeof b || a === null || b === null) return a === b;
  if (typeof a !== "object") return a === b;
  const aKeys = Object.keys(a);
  const bKeys = Object.keys(b);
  if (aKeys.length !== bKeys.length) return false;
  return aKeys.every((k) => deepEqualIgnoring(a[k], b[k]));
}

// True if the only difference between two lobby-doc snapshots is players'
// lastSeen timestamps (i.e. someone's heartbeat) — everything that actually
// affects rendered content (players joining/leaving, status, votes, reveal,
// round, spicyEnabled, ...) is unchanged. createdAt is dropped too since
// it's a serverTimestamp sentinel/Timestamp value irrelevant to rendering.
function isHeartbeatOnlyChange(prevData, nextData){
  if (!prevData || !nextData) return false;
  const strip = (data) => {
    const copy = { ...data };
    delete copy.createdAt;
    const players = {};
    Object.keys(copy.players || {}).forEach((uid) => {
      const p = copy.players[uid] || {};
      players[uid] = { name: p.name, joinedAt: p.joinedAt };
    });
    copy.players = players;
    return copy;
  };
  return deepEqualIgnoring(strip(prevData), strip(nextData));
}

// ---------- Auth ----------
// Runs entirely before the user can click anything: the "start" screen only
// renders once app.uid is set, so createLobby/joinLobby can't fire on a null
// uid during normal use. What CAN happen on flaky party wifi is
// signInAnonymously() failing outright (not just being slow) — previously that
// only logged to the console and left everyone stuck on "Lädt …" forever with
// no way to recover short of a manual reload. Now it retries with backoff and,
// if it keeps failing, shows a visible error screen with a retry button.
let authAttempts = 0;
let authRetryTimer = null;
let authInFlight = false;

function attemptSignIn(){
  if (authInFlight) return;
  authInFlight = true;
  if (authRetryTimer){ clearTimeout(authRetryTimer); authRetryTimer = null; }
  signInAnonymously(auth)
    .then(() => { authInFlight = false; })
    .catch((e) => {
      authInFlight = false;
      console.error(e);
      authAttempts++;
      app.authErrorDetail = `${e.code || e.message || "Unbekannter Fehler"}`;
      if (authAttempts < 4){
        authRetryTimer = setTimeout(attemptSignIn, Math.min(1500 * authAttempts, 6000));
      } else if (!app.uid){
        app.screen = "auth-error";
        render();
      }
    });
}

onAuthStateChanged(auth, (user) => {
  if (user){
    authAttempts = 0;
    app.uid = user.uid;
    app.name = localStorage.getItem("imposter_name") || "";
    if (app.screen === "loading" || app.screen === "auth-error"){
      app.screen = "start";
      render();
    }
  } else if (!app.uid){
    attemptSignIn();
  }
});
attemptSignIn();

if (typeof window !== "undefined"){
  window.addEventListener("offline", () => {
    app.online = false;
    render();
  });
  window.addEventListener("online", () => {
    app.online = true;
    showToast("Verbindung wiederhergestellt.");
    if (app.screen === "in-lobby" && app.code){
      subscribeLobby(app.code);
      subscribeSecret(app.code, app.uid);
    }
    render();
  });
}

// ---------- Actions ----------
async function createLobby(btn){
  const nameInput = document.getElementById("name-input");
  const name = (nameInput.value || "").trim();
  if (!name){ setStartError("Bitte gib deinen Namen ein."); return; }
  if (!app.uid){ setStartError("Noch nicht bereit, versuch's gleich nochmal."); return; }
  localStorage.setItem("imposter_name", name);
  btn.disabled = true;
  const originalText = btn.textContent;
  btn.textContent = "Erstelle Lobby …";
  try {
    let code = null;
    for (let attempt = 0; attempt < 6; attempt++){
      const candidate = generateCode();
      const existing = await withTimeout(getDoc(lobbyRef(candidate)), "Code prüfen");
      if (!existing.exists()){ code = candidate; break; }
    }
    if (!code){ throw new Error("no-code"); }
    await withTimeout(setDoc(lobbyRef(code), {
      hostUid: app.uid,
      status: "lobby",
      players: { [app.uid]: { name, joinedAt: Date.now(), lastSeen: Date.now() } },
      round: 0,
      spicyEnabled: false,
      createdAt: serverTimestamp()
    }), "Lobby anlegen");
    enterLobby(code);
  } catch (e){
    console.error(e);
    setStartError(`Lobby konnte nicht erstellt werden.${errDetail(e)} Versuch's nochmal.`);
    btn.disabled = false;
    btn.textContent = originalText;
  }
}

async function joinLobby(btn){
  const nameInput = document.getElementById("name-input");
  const codeInput = document.getElementById("code-input");
  const name = (nameInput.value || "").trim();
  const code = (codeInput.value || "").trim().toUpperCase();
  if (!name){ setStartError("Bitte gib deinen Namen ein."); return; }
  if (code.length !== 4){ setStartError("Der Code hat 4 Zeichen."); return; }
  if (!app.uid){ setStartError("Noch nicht bereit, versuch's gleich nochmal."); return; }
  localStorage.setItem("imposter_name", name);
  btn.disabled = true;
  const originalText = btn.textContent;
  btn.textContent = "Trete bei …";
  try {
    const snap = await withTimeout(getDoc(lobbyRef(code)), "Lobby suchen");
    if (!snap.exists()){ setStartError("Diese Lobby gibt es nicht."); btn.disabled = false; btn.textContent = originalText; return; }
    const data = snap.data();
    if (data.status !== "lobby"){ setStartError("Diese Runde läuft schon."); btn.disabled = false; btn.textContent = originalText; return; }
    const count = Object.keys(data.players || {}).length;
    if (count >= MAX_PLAYERS){ setStartError("Die Lobby ist voll."); btn.disabled = false; btn.textContent = originalText; return; }
    await withTimeout(updateDoc(lobbyRef(code), { [`players.${app.uid}`]: { name, joinedAt: Date.now(), lastSeen: Date.now() } }), "Beitreten");
    enterLobby(code);
  } catch (e){
    console.error(e);
    setStartError(`Beitreten hat nicht geklappt.${errDetail(e)} Versuch's nochmal.`);
    btn.disabled = false;
    btn.textContent = originalText;
  }
}

function enterLobby(code){
  app.code = code;
  app.screen = "in-lobby";
  app.lastSeenRound = -1;
  app.localPhase = "word";
  app.currentRoundSecret = null;
  app.connLostLobby = false;
  app.connLostSecret = false;
  app.editingOwnName = false;
  app.editingOwnNameDraft = null;
  subscribeLobby(code);
  subscribeSecret(code, app.uid);
  startHeartbeat();
  startPresenceTick();
}

// onSnapshot's error callback (2nd/3rd arg) is what surfaces dropped
// connections, revoked permissions etc. Without it a listener that fails just
// goes silent — the UI stays frozen on whatever it last rendered with no
// indication anything is wrong. Here we surface it (toast, once, not spammed
// on every retry) and keep retrying so a real party-wifi blip self-heals.
function subscribeLobby(code){
  if (app.unsubLobby) app.unsubLobby();
  app.unsubLobby = onSnapshot(lobbyRef(code), (snap) => {
    app.connLostLobby = false;
    if (!snap.exists()){ render(); return; }
    const data = snap.data();
    const prevData = app.lobbyData;
    app.lobbyData = data;
    app.isHost = data.hostUid === app.uid;
    if (data.status === "playing" && data.round !== app.lastSeenRound){
      app.localPhase = "word";
      app.lastSeenRound = data.round;
    }
    // Every player's heartbeat write touches this same lobby doc, so without
    // this check everyone's screen would fully rebuild every ~10s / (player
    // count) just from presence pings — replaying CSS animations and, on the
    // "guessing" screen, wiping out the imposter's in-progress word guess.
    if (isHeartbeatOnlyChange(prevData, data)){
      updateOnlineDots();
    } else {
      render();
    }
  }, (err) => {
    console.error(err);
    if (!app.connLostLobby){
      showToast(`Verbindung zur Lobby unterbrochen${errDetail(err)}. Versuche erneut …`);
    }
    app.connLostLobby = true;
    render();
    setTimeout(() => { if (app.code === code) subscribeLobby(code); }, 3000);
  });
}

function subscribeSecret(code, uid){
  if (app.unsubSecret) app.unsubSecret();
  app.unsubSecret = onSnapshot(secretRef(code, uid), (snap) => {
    app.connLostSecret = false;
    app.secretData = snap.exists() ? snap.data() : null;
    render();
  }, (err) => {
    console.error(err);
    if (!app.connLostSecret){
      showToast(`Verbindung zu deinem Wort unterbrochen${errDetail(err)}. Versuche erneut …`);
    }
    app.connLostSecret = true;
    render();
    setTimeout(() => { if (app.code === code && app.uid === uid) subscribeSecret(code, uid); }, 3000);
  });
}

function goToDiscussion(){
  app.localPhase = "discussion";
  render();
}

async function startRound(btn){
  if (!app.isHost || !app.lobbyData) return;
  const players = Object.keys(app.lobbyData.players || {});
  if (players.length < MIN_PLAYERS) return;
  const originalText = btn ? btn.textContent : "Spiel starten";
  if (btn){ btn.disabled = true; btn.textContent = "Starte Runde …"; }
  try {
    const pool = app.lobbyData.spicyEnabled ? WORD_PAIRS.concat(SPICY_WORD_PAIRS) : WORD_PAIRS;
    const pair = pool[Math.floor(Math.random() * pool.length)];
    const flip = Math.random() < 0.5;
    const mainWord = flip ? pair[0] : pair[1];
    const hintWord = flip ? pair[1] : pair[0];
    const imposterUid = players[Math.floor(Math.random() * players.length)];
    const imposterName = (app.lobbyData.players[imposterUid] || {}).name || "?";
    const starterUid = players[Math.floor(Math.random() * players.length)];
    const starterName = (app.lobbyData.players[starterUid] || {}).name || "?";
    const nextRound = (app.lobbyData.round || 0) + 1;

    await withTimeout(Promise.all(players.map((uid) => {
      const isImposter = uid === imposterUid;
      return setDoc(secretRef(app.code, uid), {
        word: isImposter ? hintWord : mainWord,
        isImposter
      });
    })), "Wörter verteilen");

    app.currentRoundSecret = { round: nextRound, imposterUid, imposterName, realWord: mainWord, hintWord };
    try {
      localStorage.setItem(`imposter_hostsecret_${app.code}`, JSON.stringify(app.currentRoundSecret));
    } catch (e){ /* ignore storage errors */ }

    await withTimeout(updateDoc(lobbyRef(app.code), {
      status: "playing",
      round: increment(1),
      reveal: deleteField(),
      votes: {},
      starterUid,
      starterName
    }), "Runde starten");
  } catch (e){
    console.error(e);
    showToast(`Runde konnte nicht gestartet werden.${errDetail(e)}`);
    if (btn){ btn.disabled = false; btn.textContent = originalText; }
  }
}

async function toggleSpicy(checked){
  if (!app.isHost || !app.code) return;
  try {
    await withTimeout(updateDoc(lobbyRef(app.code), { spicyEnabled: checked }), "Spicy-Einstellung speichern");
  } catch (e){
    console.error(e);
    showToast(`Einstellung konnte nicht gespeichert werden.${errDetail(e)}`);
  }
}

// Lets a player rename themselves while already in a lobby (not just once on
// the start screen). Same write pattern as votes/heartbeat: a normal member
// updating their own players.{uid} entry, no host relay needed. Only ever
// called with app.uid as the target — there's no path to rename anyone else.
async function renameSelf(newName){
  if (!app.code || !app.uid) return;
  await withTimeout(updateDoc(lobbyRef(app.code), { [`players.${app.uid}.name`]: newName }), "Namen ändern");
  localStorage.setItem("imposter_name", newName);
  app.name = newName;
}

let voteInFlight = false;
async function castVote(votedUid, el){
  if (!app.code || !app.uid || voteInFlight) return;
  voteInFlight = true;
  try {
    if (el) el.classList.add("voted");
    await withTimeout(updateDoc(lobbyRef(app.code), { [`votes.${app.uid}`]: votedUid }), "Stimme abgeben");
  } catch (e){
    console.error(e);
    showToast(`Stimme konnte nicht gespeichert werden.${errDetail(e)}`);
  } finally {
    voteInFlight = false;
  }
}

// Ends the discussion and opens the dedicated voting phase. No secret/word
// data involved here — just a status flip, same host-authoritative pattern
// as the rest of the state machine.
async function backToLobby(btn){
  if (!app.isHost || !app.lobbyData) return;
  const originalText = btn ? btn.textContent : "Zurück in die Lobby";
  if (btn){ btn.disabled = true; btn.textContent = "Kehre zurück …"; }
  try {
    await withTimeout(updateDoc(lobbyRef(app.code), {
      status: "lobby",
      reveal: deleteField(),
      votes: deleteField(),
      starterUid: deleteField(),
      starterName: deleteField()
    }), "Zurück in die Lobby");
  } catch (e){
    console.error(e);
    showToast(`Zurück in die Lobby hat nicht geklappt.${errDetail(e)}`);
    if (btn){ btn.disabled = false; btn.textContent = originalText; }
  }
}

async function startVoting(btn){
  if (!app.isHost || !app.lobbyData) return;
  const originalText = btn ? btn.textContent : "Abstimmung starten";
  if (btn){ btn.disabled = true; btn.textContent = "Starte Abstimmung …"; }
  try {
    await withTimeout(updateDoc(lobbyRef(app.code), { status: "voting" }), "Abstimmung starten");
  } catch (e){
    console.error(e);
    showToast(`Abstimmung konnte nicht gestartet werden.${errDetail(e)}`);
    if (btn){ btn.disabled = false; btn.textContent = originalText; }
  }
}

// Host tallies the votes locally (same pattern as word assignment: host
// computes, then writes one authoritative result for everyone) and reveals.
// Callable even if not everyone has voted yet, so an inactive player can't
// stall the game.
async function evaluateVotes(btn){
  if (!app.isHost || !app.lobbyData) return;
  let secret = app.currentRoundSecret;
  if (!secret || secret.round !== app.lobbyData.round){
    try {
      const raw = localStorage.getItem(`imposter_hostsecret_${app.code}`);
      if (raw){
        const parsed = JSON.parse(raw);
        if (parsed.round === app.lobbyData.round) secret = parsed;
      }
    } catch (e){ /* ignore */ }
  }
  if (!secret || secret.round !== app.lobbyData.round){
    showToast("Auswertung nicht verfügbar (Seite neu geladen?). Bitte eine neue Runde starten.");
    return;
  }
  const preCheckPlayers = app.lobbyData.players || {};
  const preCheckUids = Object.keys(preCheckPlayers);
  const preCheckVotes = app.lobbyData.votes || {};
  const preCheckVotedCount = preCheckUids.filter((uid) => preCheckVotes[uid] !== undefined).length;
  if (preCheckUids.length && preCheckVotedCount < preCheckUids.length){
    showToast("Noch nicht alle haben abgestimmt.");
    return;
  }
  if (btn){ btn.disabled = true; btn.textContent = "Werte aus …"; }
  try {
    const players = app.lobbyData.players || {};
    const uids = Object.keys(players);
    const votes = app.lobbyData.votes || {};

    const voteCounts = {};
    uids.forEach((uid) => { voteCounts[uid] = 0; });
    Object.values(votes).forEach((suspectUid) => {
      if (Object.prototype.hasOwnProperty.call(voteCounts, suspectUid)) voteCounts[suspectUid]++;
    });

    const maxVotes = uids.length ? Math.max(...uids.map((uid) => voteCounts[uid])) : 0;
    const topUids = maxVotes > 0 ? uids.filter((uid) => voteCounts[uid] === maxVotes) : [];
    // Unique winner -> that's the group's suspect. No votes at all, or a tie
    // between 2+ people, both count as "no clear suspicion" — and per Tim's
    // rule that's a loss for the group, not a neutral outcome: only a clean,
    // unique pick of the actual imposter counts as the crewmates winning.
    const groupPickUid = topUids.length === 1 ? topUids[0] : null;
    const groupPickName = groupPickUid ? (players[groupPickUid].name || "?") : null;
    const groupCorrect = groupPickUid === secret.imposterUid;

    const revealPayload = {
      imposterUid: secret.imposterUid,
      imposterName: secret.imposterName,
      realWord: secret.realWord,
      hintWord: secret.hintWord,
      groupPickUid,
      groupPickName,
      groupCorrect,
      voteCounts
    };

    // Crewmates got it right -> imposter gets one last chance to guess the
    // real word before the result is final (a correct guess flips the win
    // back to the imposter). Otherwise the imposter already won outright
    // (wrong suspect or no clear suspicion), so there's nothing to guess for.
    await withTimeout(updateDoc(lobbyRef(app.code), {
      status: groupCorrect ? "guessing" : "reveal",
      reveal: revealPayload
    }), "Auswerten");
  } catch (e){
    console.error(e);
    showToast(`Auswerten hat nicht geklappt.${errDetail(e)}`);
    if (btn){ btn.disabled = false; btn.textContent = "Auswerten"; }
  }
}

// Loose comparison for the imposter's word guess: trims, lowercases and
// collapses whitespace so "  Kaffee " / "kaffee" / "KAFFEE" all match. No
// fuzzy/typo tolerance and no accent-stripping on purpose — German umlauts
// (ä/ö/ü) are meaningful letters, not accents, so "normalizing" them away
// would make wrong words match. Deliberately simple, not over-engineered.
function normalizeGuess(str){
  return String(str || "").trim().toLowerCase().replace(/\s+/g, " ");
}

// Called by the imposter's own client once they've been unmasked (status
// "guessing"). Unlike the rest of the state machine this isn't host-gated:
// the imposter is a normal authenticated lobby member and the rules already
// let any member write the lobby doc, so no host-relay round trip is needed.
async function submitImposterGuess(guessText, skip){
  if (!app.code || !app.lobbyData || !app.lobbyData.reveal) return;
  if (app.lobbyData.reveal.imposterUid !== app.uid) return;
  try {
    if (skip){
      await withTimeout(updateDoc(lobbyRef(app.code), { status: "reveal" }), "Raten überspringen");
    } else {
      const realWord = app.lobbyData.reveal.realWord || "";
      const guessValue = (guessText || "").trim();
      const correct = normalizeGuess(guessValue) === normalizeGuess(realWord);
      await withTimeout(updateDoc(lobbyRef(app.code), {
        status: "reveal",
        "reveal.imposterGuess": guessValue,
        "reveal.imposterGuessCorrect": correct
      }), "Wort raten");
    }
  } catch (e){
    console.error(e);
    showToast(`Raten hat nicht geklappt.${errDetail(e)}`);
    const submitBtn = document.getElementById("submit-guess-btn");
    const skipBtn = document.getElementById("skip-guess-btn");
    if (submitBtn) submitBtn.disabled = false;
    if (skipBtn) skipBtn.disabled = false;
  }
}

function leaveLobby(){
  stopDiscussionTimer();
  stopHeartbeat();
  stopPresenceTick();
  if (app.unsubLobby){ app.unsubLobby(); app.unsubLobby = null; }
  if (app.unsubSecret){ app.unsubSecret(); app.unsubSecret = null; }
  if (app.code && app.uid){
    updateDoc(lobbyRef(app.code), { [`players.${app.uid}`]: deleteField() })
      .catch((e) => console.error("Konnte Spieler beim Verlassen nicht entfernen:", e));
  }
  app.code = null;
  app.lobbyData = null;
  app.secretData = null;
  app.isHost = false;
  app.currentRoundSecret = null;
  app.localPhase = "word";
  app.startMode = "menu";
  app.connLostLobby = false;
  app.connLostSecret = false;
  app.editingOwnName = false;
  app.editingOwnNameDraft = null;
  app.screen = "start";
  render();
}

function setStartError(msg){
  const el = document.getElementById("start-error");
  if (el) el.textContent = msg || "";
}

// ---------- Render ----------
function render(){
  const el = document.getElementById("app");
  if (app.screen !== "in-lobby" || (app.lobbyData && app.lobbyData.status !== "playing") || app.localPhase !== "discussion"){
    stopDiscussionTimer();
  }

  if (app.screen === "loading"){
    el.innerHTML = renderLoading("Verbinde …");
    return;
  }
  if (app.screen === "auth-error"){
    el.innerHTML = renderAuthError();
    bindAuthErrorEvents();
    return;
  }
  if (app.screen === "start"){
    el.innerHTML = renderStart();
    bindStartEvents();
    return;
  }
  if (app.screen === "in-lobby"){
    if (!app.lobbyData){ el.innerHTML = renderLoading("Lade Lobby …"); return; }
    const status = app.lobbyData.status;
    if (status === "lobby"){
      el.innerHTML = renderWaitingRoom();
      bindWaitingRoomEvents();
    } else if (status === "playing"){
      if (app.localPhase === "word"){
        el.innerHTML = renderWordScreen();
        bindWordEvents();
      } else {
        el.innerHTML = renderDiscussionScreen();
        bindDiscussionEvents();
        ensureDiscussionTimer();
      }
    } else if (status === "voting"){
      el.innerHTML = renderVotingScreen();
      bindVotingEvents();
    } else if (status === "guessing"){
      el.innerHTML = renderGuessingScreen();
      bindGuessingEvents();
    } else if (status === "reveal"){
      el.innerHTML = renderRevealScreen();
      bindRevealEvents();
    }
  }
}

// Inline "edit my own name" control in the player list. app.editingOwnName
// toggles which markup renderWaitingRoom() emits for the own list item;
// app.editingOwnNameDraft mirrors the input's live value (updated on every
// keystroke, no render() call) so an incidental full re-render mid-typing —
// e.g. another player joining/leaving while editing — restores the text the
// user was typing instead of snapping back to the old server-side name.
function bindNameEditEvents(){
  const editBtn = document.getElementById("edit-name-btn");
  if (editBtn){
    editBtn.addEventListener("click", () => {
      app.editingOwnName = true;
      app.editingOwnNameDraft = null;
      render();
    });
  }

  const input = document.getElementById("edit-name-input");
  const saveBtn = document.getElementById("save-name-btn");
  const cancelBtn = document.getElementById("cancel-name-btn");
  if (!input) return;

  setTimeout(() => { input.focus(); input.select(); }, 0);
  input.addEventListener("input", () => { app.editingOwnNameDraft = input.value; });
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter"){ e.preventDefault(); saveNameEdit(); }
    else if (e.key === "Escape"){ e.preventDefault(); cancelNameEdit(); }
  });

  function saveNameEdit(){
    const value = (input.value || "").trim();
    if (!value){
      showToast("Bitte gib einen Namen ein.");
      return;
    }
    if (saveBtn) saveBtn.disabled = true;
    if (cancelBtn) cancelBtn.disabled = true;
    input.disabled = true;
    renameSelf(value)
      .then(() => {
        app.editingOwnName = false;
        app.editingOwnNameDraft = null;
        render();
      })
      .catch((e) => {
        console.error(e);
        showToast(`Name konnte nicht geändert werden.${errDetail(e)}`);
        if (saveBtn) saveBtn.disabled = false;
        if (cancelBtn) cancelBtn.disabled = false;
        input.disabled = false;
      });
  }

  function cancelNameEdit(){
    app.editingOwnName = false;
    app.editingOwnNameDraft = null;
    render();
  }

  if (saveBtn) saveBtn.addEventListener("click", saveNameEdit);
  if (cancelBtn) cancelBtn.addEventListener("click", cancelNameEdit);
}

// lobby's onSnapshot listener) and the reveal screen (final state). Voting
// stays changeable the whole time — this just reflects whatever the current

function voteListHtml(votes, players){

function renderVotingScreen(){
  const players = app.lobbyData.players || {};
  const uids = Object.keys(players);
  const votes = app.lobbyData.votes || {};
  const myVote = votes[app.uid];
  const votedCount = uids.filter((uid) => votes[uid] !== undefined).length;

  // You can't vote for yourself — keeps the group's suspicion pointed
  // outward, and avoids a self-vote muddying the tally.
  const suspectUids = uids.filter((uid) => uid !== app.uid);
  const items = suspectUids.map((uid) => {
    const voted = myVote === uid;
    return `<button class="vote-btn ${voted ? "voted" : ""}" data-uid="${esc(uid)}">
      <span>${playerNameHtml(uid, players)}</span>
      <span class="vote-check">✓</span>
    </button>`;
  }).join("");

  const allVoted = uids.length > 0 && votedCount >= uids.length;

  return `
    <div class="screen">
      <div class="brand"><strong>🕵️ Imposter</strong></div>
      ${connStatusHtml()}
      <div class="section-title">Wer ist der Imposter?</div>
      <p class="hint-text">Tippt euch auf eine Person ein. Du kannst deine Wahl ändern, solange der Host noch nicht ausgewertet hat.</p>
      <div>${items}</div>
      <p class="hint-text">${votedCount}/${uids.length} haben abgestimmt</p>
      ${voteListHtml(votes, players)}
      <div class="spacer"></div>
      ${app.isHost
        ? (allVoted
            ? `<button class="btn btn-primary" id="evaluate-btn">Auswerten</button>`
            : `<button class="btn btn-primary" id="evaluate-btn" disabled>Auswerten</button>
               <p class="hint-text">Wartet auf alle Stimmen (${votedCount}/${uids.length}) …</p>`)
        : `<p class="hint-text">Warte auf die Auswertung durch den Host …</p>`
      }
    </div>
  `;
}

      document.querySelectorAll(".vote-btn").forEach((b) => b.classList.remove("voted"));

// Only reached when the crewmates correctly picked the imposter
// (reveal.groupCorrect === true) — the imposter gets one last shot at
// guessing the real word before the result is locked in. The imposter's own
// client shows the input; everyone else just waits, no spoilers on this
// screen (realWord/hintWord only render on the final reveal screen).
function renderGuessingScreen(){
  const reveal = app.lobbyData.reveal || {};
  const isImposter = reveal.imposterUid === app.uid;

  if (!isImposter){
    return `
      <div class="screen">
        <div class="brand"><strong>🕵️ Imposter</strong></div>
        ${connStatusHtml()}
        <div class="loading-stage">${esc(reveal.imposterName || "Der Imposter")} wurde enttarnt und bekommt eine letzte Chance, das Wort zu erraten …</div>
      </div>
    `;
  }

  return `
    <div class="screen">
      <div class="brand"><strong>🕵️ Imposter</strong></div>
      ${connStatusHtml()}
      <div class="reveal-stage" style="flex: 0 0 auto; margin-bottom: 8px;">
        <div class="reveal-eyebrow">Du wurdest enttarnt!</div>
        <div class="the-word" style="font-size: clamp(1.6rem, 7vw, 2.4rem);">Kennst du das echte Wort?</div>
        <p class="imposter-note">Errätst du es, gewinnst du trotzdem. Falls nicht, haben die Crewmates gewonnen.</p>
      </div>
      <div>
        <label for="guess-input">Deine Vermutung</label>
        <input type="text" id="guess-input" placeholder="Echtes Wort …" maxlength="40" autocomplete="off">
      </div>
      <p class="error-text" id="guess-error"></p>
      <div class="spacer"></div>
      <div class="btn-row">
        <button class="btn btn-primary" id="submit-guess-btn">Wort abschicken</button>
        <button class="btn btn-ghost" id="skip-guess-btn">Ich weiß es nicht</button>
      </div>
    </div>
  `;
}

function bindGuessingEvents(){
  const submitBtn = document.getElementById("submit-guess-btn");
  const skipBtn = document.getElementById("skip-guess-btn");
  const input = document.getElementById("guess-input");

  if (submitBtn){
    submitBtn.addEventListener("click", () => {
      const value = (input && input.value || "").trim();
      if (!value){
        const err = document.getElementById("guess-error");
        if (err) err.textContent = "Bitte gib ein Wort ein oder wähle „Ich weiß es nicht“.";
        return;
      }
      submitBtn.disabled = true;
      if (skipBtn) skipBtn.disabled = true;
      submitImposterGuess(value, false);
    });
  }
  if (skipBtn){
    skipBtn.addEventListener("click", () => {
      skipBtn.disabled = true;
      if (submitBtn) submitBtn.disabled = true;
      submitImposterGuess(null, true);
    });
  }
}

function renderRevealScreen(){
  const reveal = app.lobbyData.reveal || {};
  const players = app.lobbyData.players || {};
  const votes = app.lobbyData.votes || {};
  const voteCounts = reveal.voteCounts || {};

  // Always a binary result now — no more neutral "no clear verdict" outcome.
  // A tie / no unique suspect counts as a straight imposter win, same as
  // picking the wrong person. The only way crewmates win is a clean, unique
  // pick of the real imposter AND (if it came to that) the imposter failing
  // or skipping their comeback guess.
  const imposterLabel = esc(reveal.imposterName || "Der Imposter");
  let verdictHtml;
  if (reveal.groupCorrect === true){
    if (reveal.imposterGuessCorrect === true){
      verdictHtml = `<p class="verdict-banner verdict-bad">😈 Imposter gewinnt! ${imposterLabel} wurde enttarnt, hat aber „${esc(reveal.imposterGuess || "")}“ richtig erraten.</p>`;
    } else {
      const guessNote = reveal.imposterGuess
        ? ` ${imposterLabel} hat noch „${esc(reveal.imposterGuess)}“ geraten – falsch.`
        : "";
      verdictHtml = `<p class="verdict-banner verdict-ok">🎉 Crewmates gewinnen! Ihr habt ${imposterLabel} erwischt.${guessNote}</p>`;
    }
  } else if (reveal.groupPickUid){
    verdictHtml = `<p class="verdict-banner verdict-bad">😈 Imposter gewinnt! Die Gruppe hat fälschlicherweise ${esc(reveal.groupPickName || "jemand anderen")} verdächtigt.</p>`;
  } else {
    verdictHtml = `<p class="verdict-banner verdict-bad">😈 Imposter gewinnt! Kein eindeutiger Verdacht in der Gruppe.</p>`;
  }

  // voteCounts (host-computed at evaluation) is the source of truth for the
  // tally. Falls back to just listing players if an old-format reveal has no
  // voteCounts (e.g. mid-migration data).
  const tallyUids = Object.keys(voteCounts).length ? Object.keys(voteCounts) : Object.keys(players);
  const tallyRows = tallyUids
    .filter((uid) => players[uid])
    .sort((a, b) => (voteCounts[b] || 0) - (voteCounts[a] || 0))
    .map((uid) => {
      const isImp = uid === reveal.imposterUid;
      const isPick = uid === reveal.groupPickUid;
      const count = voteCounts[uid] || 0;
      return `<div class="tally-row ${isImp ? "is-imposter" : ""}">
        <span>${playerNameHtml(uid, players)}${isImp ? " 🕵️" : ""}${isPick ? " 👉" : ""}</span>
        <span>${count} Stimme${count === 1 ? "" : "n"}</span>
      </div>`;
    }).join("");

  const whoVotedWhomHtml = voteListHtml(votes, players);

  return `
    <div class="screen">
      <div class="brand"><strong>🕵️ Imposter</strong></div>
      ${connStatusHtml()}
      <div class="reveal-stage">
        <div class="reveal-eyebrow">Der Imposter war</div>
        <div class="reveal-name">${esc(reveal.imposterName || "?")}</div>
        <div class="reveal-words">
          <div class="reveal-word-row"><span class="k">Echtes Wort</span><span class="v">${esc(reveal.realWord || "?")}</span></div>
          <div class="reveal-word-row"><span class="k">Hinweiswort</span><span class="v">${esc(reveal.hintWord || "?")}</span></div>
        </div>
      </div>
      ${verdictHtml}
      <div class="section-title">Abstimmung</div>
      <div class="card">${tallyRows}</div>
      ${whoVotedWhomHtml}
      ${spicySectionHtml()}
      <div class="spacer"></div>
      ${app.isHost
        ? `<div class="btn-row">
             <button class="btn btn-primary" id="new-round-btn">Neue Runde</button>
             <button class="btn btn-ghost" id="back-to-lobby-btn">Zurück in die Lobby</button>
             <button class="btn btn-ghost" id="leave-btn">Lobby verlassen</button>
           </div>`
        : `<button class="btn btn-ghost" id="leave-btn">Lobby verlassen</button>`
      }
    </div>
  `;
}

function bindRevealEvents(){
  const newRoundBtn = document.getElementById("new-round-btn");
  const backToLobbyBtn = document.getElementById("back-to-lobby-btn");
  const leaveBtn = document.getElementById("leave-btn");
  if (newRoundBtn) newRoundBtn.addEventListener("click", () => startRound(newRoundBtn));
  if (backToLobbyBtn) backToLobbyBtn.addEventListener("click", () => backToLobby(backToLobbyBtn));
  if (leaveBtn) leaveBtn.addEventListener("click", leaveLobby);
  bindSpicyToggleEvents();
}

render();
</script>
</body>
</html>
